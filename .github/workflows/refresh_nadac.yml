name: Refresh NADAC data

# CMS usually posts the weekly NADAC file on Wednesday, so we refresh Thursday.
# Committing new data to main makes Streamlit Community Cloud redeploy the app.
on:
  schedule:
    - cron: "23 14 * * 4"   # Thursdays 14:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NADAC and write data/nadac_latest.parquet
        run: python scripts/refresh_nadac.py

      - name: Commit if the data changed
        run: |
          git add data/   # stage first so brand-new files count as changes
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh NADAC data ($(python -c 'import json;print(json.load(open("data/nadac_meta.json"))["as_of_date"])'))"
          git push
